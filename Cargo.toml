[workspace]
members = [
    "crates/usb4-gpu-staging",
    "crates/usb4-llama-rpc",
    "crates/usb4-nccl-net",
    "crates/usb4-ofi-provider",
    "crates/usb4-proto",
    "crates/usb4-rdma-core",
    "crates/usb4-rdma-ctl",
    "crates/usb4-sim",
    "crates/usb4-stream-hal",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/han-minhee/usb4-rdma"
readme = "crates/README.md"

[workspace.dependencies]
usb4-gpu-staging = { path = "crates/usb4-gpu-staging", version = "0.1.0" }
usb4-sim = { path = "crates/usb4-sim", version = "0.1.0" }
usb4-proto = { path = "crates/usb4-proto", version = "0.1.0" }
usb4-rdma-core = { path = "crates/usb4-rdma-core", version = "0.1.0" }
usb4-stream-hal = { path = "crates/usb4-stream-hal", version = "0.1.0" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
crc32fast = "1"
zerocopy = { version = "0.8", features = ["derive"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
