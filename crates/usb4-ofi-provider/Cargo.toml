[package]
name = "usb4-ofi-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-memory libfabric OFI engine for Open MPI over usb4-rdma"

[lib]
name = "usb4_fi"
crate-type = ["cdylib"]

[dependencies]
libc = { workspace = true, optional = true }
usb4-rdma-core = { workspace = true, optional = true }

[features]
native = ["dep:usb4-rdma-core", "dep:libc"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[lints]
workspace = true
